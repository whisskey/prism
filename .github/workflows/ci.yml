name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit and plugin tests
        run: go test ./internal/... ./pkg/... -count=1

      - name: Run integration tests
        run: go test ./tests/integration/... -count=1

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CLI E2E tests
        run: go test ./tests/e2e/... -count=1

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -o prism ./cmd

      - name: Verify CLI
        run: ./prism version

      - name: Build golangci plugin
        run: go build -o prism-gcl ./internal/golangci/plugin

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-${{ runner.os }}
          path: prism
          retention-days: 7
